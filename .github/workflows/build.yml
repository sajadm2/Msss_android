name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Find and Extract ZIP Project
        run: |
          echo "Searching for uploaded ZIP files..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip file found in the repository root!"
            exit 1
          fi
          
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          
          # Find the actual project directory (handles both flat and nested structures)
          if [ -d "extracted-project/MousaviVPN" ]; then
            echo "PROJECT_DIR=extracted-project/MousaviVPN" >> $GITHUB_ENV
          else
            # Find the first subdirectory inside extracted-project
            SUB_DIR=$(find extracted-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$SUB_DIR" ]; then
              echo "PROJECT_DIR=$SUB_DIR" >> $GITHUB_ENV
            else
              echo "PROJECT_DIR=extracted-project" >> $GITHUB_ENV
            fi
          fi

      - name: Prepare Gradle Wrapper
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mssh-alpha-debug
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
