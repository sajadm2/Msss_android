name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK Manually
        run: |
          echo "Downloading Android NDK 27.2.12479018..."
          curl -Lo ndk.zip https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q ndk.zip
          sudo mv android-ndk-r27b /usr/local/android-ndk
          echo "ANDROID_NDK_HOME=/usr/local/android-ndk" >> $GITHUB_ENV
          echo "ndk.dir=/usr/local/android-ndk" >> local.properties

      - name: Find and Extract Project ZIP
        run: |
          echo "Searching for uploaded zip file..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in the repository root!"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

      - name: Locate Project Directory and gradlew
        run: |
          echo "Locating build files..."
          # پیدا کردن پوشه‌ای که حاوی build.gradle یا settings.gradle است
          PROJ_DIR=$(find extracted-project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$PROJ_DIR" ]; then
            echo "Error: Could not locate project root inside ZIP!"
            exit 1
          echo "Project directory is: $PROJ_DIR"
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

          # اگر gradlew وجود ندارد، آن را می‌سازیم
          if [ ! -f "$PROJ_DIR/gradlew" ]; then
            echo "Generating Gradle wrapper..."
            cd "$PROJ_DIR"
            gradle wrapper --gradle-version 8.9
            cd -
          fi

          chmod +x "$PROJ_DIR/gradlew"

      - name: Build Debug APK with Gradle
        run: |
          echo "Starting Gradle build..."
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mssh-alpha-debug
          path: |
            **/build/outputs/apk/debug/*.apk
